# Render Blueprint for the CodeBridge API (https://render.com/docs/blueprint-spec)
services:
  - type: web
    name: codebridge-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.15
      # Comma-separated frontend origins, e.g. https://codebridge.vercel.app
      - key: CORS_ORIGINS
        sync: false
      - key: MAX_SOURCE_CHARS
        value: "20000"
